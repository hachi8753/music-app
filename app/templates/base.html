<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block header %} Music App {% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        function confirmAction(event) {
            // 確認ダイアログを表示
            var userConfirmed = confirm("OK?");

            // 「キャンセル」を押した場合はデフォルトのリンク動作をキャンセル
            if (!userConfirmed) {
                event.preventDefault();
            }
        }
        function toggleMenu() {
            var nav = document.querySelector('.main-nav');
            if (nav.style.display === 'flex') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'flex';
            }
        }
    </script>
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
</head>



<body>


    <header class="navbar navbar-expand-lg page-header fixed-top py-1">
        <div class="container-fluid wrapper">
    
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}">
            </a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <!-- メニュー -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
    
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.mypage') }}">Mypage</a>
                    </li>
    
                </ul>
            </div>
        </div>
    </header>

    {% block content %} Music App {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
