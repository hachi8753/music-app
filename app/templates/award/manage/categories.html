{% extends "base.html" %}

{% block header %} 管理 | Award {% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('award.manage_awards') }}" class="btn btn-outline-secondary btn-sm">
            ← 戻る
        </a>
        <h2 class="mb-0">部門管理 | {{ award.name }}</h2>

        <a href="{{ url_for('award.create_award_category', award_id=award.id) }}">
            <button class="btn btn-primary">
                部門追加
            </button>
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">

            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>表示名</th>
                    <th>表示順</th>
                    <th>開始年</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>

            <tbody>

                {% for c in award_categories %}

                <tr>

                    <td>
                        {{ c.id }}
                    </td>

                    <td>
                        <a href="{{ url_for('award.manage_award_category', award_category_id=c.id) }}">
                            {{ c.name }}
                        </a>
                    </td>

                    <td>
                        {{ c.short_name }}
                    </td>

                    <td>
                        {{ c.award_order }}
                    </td>

                    <td>
                        {{ c.start_year }}
                    </td>

                    <td class="text-end">

                        <div class="btn-group">

                            <a href="{{ url_for('award.index') }}" class="btn btn-sm btn-outline-primary">
                                編集
                            </a>

                            <form action="{{ url_for('award.index') }}" method="POST"
                                onsubmit="return confirm('削除しますか？')">

                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    削除
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>
    </div>
</div>


{% endblock %}
