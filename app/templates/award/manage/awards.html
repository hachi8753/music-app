{% extends "base.html" %}

{% block header %} 管理 | Award {% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Award管理</h2>

        <a href="{{ url_for('award.create_award') }}">
            <button class="btn btn-primary">
                Award追加
            </button>
        </a>

    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">

            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>国</th>
                    <th>表示順</th>
                    <th>作成日</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>

            <tbody>

                {% for award in awards %}

                <tr>

                    <td>
                        {{ award.id }}
                    </td>

                    <td>
                        <a href="{{ url_for('award.manage_award_categories', award_id=award.id) }}">
                            {{ award.name }}
                        </a>
                    </td>

                    <td>
                        {{ award.country }}
                    </td>

                    <td>
                        {{ award.priority }}
                    </td>

                    <td>
                        {{ award.created_at.strftime('%Y-%m-%d') }}
                    </td>

                    <td class="text-end">

                        <div class="btn-group">

                            <a href="{{ url_for('award.manage_award', award_id=award.id) }}"
                                class="btn btn-sm btn-outline-primary">
                                編集
                            </a>

                            <form action="{{ url_for('award.index') }}" method="POST"
                                onsubmit="return confirm('削除しますか？')">

                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    削除
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>
    </div>
</div>


{% endblock %}
