{% extends "base.html" %}

{% block header %} 管理 | Award {% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex align-items-center gap-3 mb-4">

        <a href="{{ url_for('award.manage_award_categories', award_id=award_category.award_id) }}"
            class="btn btn-outline-secondary btn-sm">
            ← 戻る
        </a>

        <h1 class="mb-0">
            Award Category 編集
        </h1>

    </div>


    <form method="POST">

        <!-- 基本情報 -->
        <div class="card mb-4">
            <div class="card-header">
                基本情報
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">
                        name
                    </label>

                    <input type="text" name="name" class="form-control" value="{{ award_category.name or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        display_name
                    </label>

                    <input type="text" name="display_name" class="form-control"
                        value="{{ award_category.display_name or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        short_name
                    </label>
                
                    <input type="text" name="short_name" class="form-control"
                         value="{{ award_category.short_name or '' }}">
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            award_order
                        </label>

                        <input type="number" name="award_order" class="form-control"
                            value="{{ award_category.award_order or '' }}">
                    </div>
                </div>

            </div>
        </div>

        <!-- 分類属性 -->
        <div class="card mb-4">

            <div class="card-header">
                分類属性
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            subject_type
                        </label>

                        <select name="subject_type" class="form-select">
                            <option value=""></option>

                            <option value="film" {% if award_category.subject_type=='film' %}selected{% endif %}>
                                film
                            </option>

                            <option value="person" {% if award_category.subject_type=='person' %}selected{% endif %}>
                                person
                            </option>

                            <option value="both" {% if award_category.subject_type=='both' %}selected{% endif %}>
                                both
                            </option>

                        </select>
                    </div>

                </div>

            </div>
        </div>

        <!-- 表示設定 -->
        <div class="card mb-4">

            <div class="card-header">
                表示設定
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">
                        display_group_label
                    </label>

                    <input type="text" name="display_group_label" class="form-control"
                        value="{{ award_category.display_group_label or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        display_variant_label
                    </label>

                    <input type="text" name="display_variant_label" class="form-control"
                        value="{{ award_category.display_variant_label or '' }}">
                </div>

                <div class="form-check">

                    <input class="form-check-input" type="checkbox" name="display_as_child" id="display_as_child" {% if
                        award_category.display_as_child %}checked{% endif %}>

                    <label class="form-check-label" for="display_as_child">
                        display_as_child
                    </label>

                </div>

            </div>
        </div>

        <div class="d-flex justify-content-end">

            <button type="submit" class="btn btn-primary">
                保存
            </button>

        </div>

    </form>

</div>


{% endblock %}
